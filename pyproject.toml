[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-bee-ekantipur-scraper"
version = "0.1.0"
description = "Audio Bee – Data Extraction Intern Practical Test: ekantipur.com Playwright scraper"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Allow `pip install .` from this folder without packaging extra directories.
[tool.setuptools]
py-modules = ["scraper"]
